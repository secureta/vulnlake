[project]
name = "vlake"
version = "0.1.0"
description = "Security datasets published as a frozen DuckLake on S3-compatible storage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "duckdb>=2.0.0,<3",
    "pyarrow>=26.0.1,<27",
    "boto3>=1.44.0",
    "httpx>=0.28.1",
    "click>=8.5.1",
    "cvss>=3.6",
    "pyyaml>=6.0.3",
    "defusedxml>=0.7.1",
]

[project.scripts]
vlake = "vlake.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # デフォルト (pycodestyle/pyflakes)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (SAST)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest では assert が正当
"tests/test_catalog_compatibility.py" = ["S603"]
